name: CI Multi-Distro Build & Test

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - 'README.md'
      - 'plan.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - 'README.md'
      - 'plan.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: write

jobs:
  test_linux:
    name: Test on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [rockylinux-9, ubuntu-24.04]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Rocky Linux 9 Container Test (Enabling CRB & EPEL for gtest-devel)
      - name: Run Build, Tests & Benchmark on Rocky Linux 9
        if: matrix.distro == 'rockylinux-9'
        uses: docker://rockylinux:9
        with:
          args: >
            bash -c "
            dnf install -y dnf-plugins-core epel-release &&
            dnf config-manager --set-enabled crb &&
            dnf install -y gcc-c++ make gtest-devel glibc-devel python3 &&
            make all &&
            make bench &&
            make test
            "

      # Ubuntu 24.04 Host Test
      - name: Run Build, Tests & Benchmark on Ubuntu 24.04
        if: matrix.distro == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev build-essential python3
          make all
          make bench
          make test

      # Publish test and benchmark summary directly to the GitHub Actions run page
      - name: Publish Test Summary
        if: always()
        run: |
          sudo chown -R $(id -u):$(id -g) reports/ 2>/dev/null || true
          if [ -f reports/test_report.xml ]; then
            DISTRO_NAME="${{ matrix.distro }}" python3 scripts/generate_report.py
          fi

      # Upload test report artifacts
      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.distro }}
          path: reports/

      # Deploy HTML dashboard to GitHub Pages on master push
      - name: Deploy Dashboard to GitHub Pages
        if: matrix.distro == 'ubuntu-24.04' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
